name: One-time hakgyesan migration

on:
  push:
    branches: [migration-hakgyesan-exec]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration-hakgyesan-exec
          fetch-depth: 0

      - name: Prepare migration
        run: python scripts/migrate_hakgyesan.py

      - name: Validate and commit migration
        run: |
          git diff --check
          rm -f scripts/migrate_hakgyesan.py .github/workflows/migrate-hakgyesan.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Migrate 학계산 to /hakgyesan/ and add Reridy hub"
          git push origin HEAD:migration-hakgyesan-exec
